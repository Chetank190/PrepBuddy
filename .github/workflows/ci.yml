name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: depoprep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: depoprep/package-lock.json
      - run: npm ci
      # No API keys: these test the code around the models (validation, injection detector, follow-up bounds).
      # The model eval needs keys and a Convex deployment; run it from /evals.
      - run: npm test
